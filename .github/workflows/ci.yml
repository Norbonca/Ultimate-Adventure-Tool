name: CI

# ============================================================
# LOCAL-FIRST WORKFLOW
# ============================================================
# 1. Fejlesztés és tesztelés a local dev environment-ben
#    (pnpm local:start → pnpm dev → manuális teszt)
# 2. Feature branch-re push → PR nyitás main felé
# 3. Ez a CI workflow automatikusan fut a PR-en
# 4. Ha zöld → merge main-be → Vercel automatikusan deployol
#    + supabase db push automatikusan lefut (DB szinkron!)
# ============================================================

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]  # Vercel deploy utáni ellenőrzés

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Unit and action regression tests
        run: pnpm test

      - name: Build
        run: pnpm build

  qa-audit:
    name: QA Audit Gate (trevu-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # A .skills/trevu-test szkriptek csak node builtineket használnak,
    # ezért nem kell hozzájuk pnpm install.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Az útmutató-frissesség kapu a PR alap-commitjához képest diffel.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: i18n sync (HU/EN kulcsparitás)
        run: node .skills/trevu-test/scripts/check-i18n-sync.mjs

      - name: i18n quality
        run: node .skills/trevu-test/scripts/check-i18n-quality.mjs

      - name: Internal links
        run: node .skills/trevu-test/scripts/check-links.mjs

      - name: Category consistency
        run: node .skills/trevu-test/scripts/check-categories.mjs

      - name: Security scan
        run: node .skills/trevu-test/scripts/check-security.mjs

      - name: Architectural invariants
        run: node .skills/trevu-test/scripts/check-architecture.mjs

      # M211 (CLAUDE.md 3.12): érinti-e EZ a változás az útmutatók képernyőképeit?
      # Csak jelez, nem blokkol: a fejlesztést nem tartja fel az útmutatóképek újrafelvétele.
      # A tényleges ellenőrzés és frissítés ütemezetten, a véglegesítés után fut
      # (.github/workflows/utmutato-frissesseg.yml). Norbert döntése, 2026-11-14.
      - name: Útmutató-frissesség (M211, csak jelzés)
        if: github.event_name == 'pull_request'
        run: node apps/web/scripts/check-tutorial-freshness.mjs --figyelmeztet --diff "${{ github.event.pull_request.base.sha }}"

  db-push:
    name: Supabase DB Push
    runs-on: ubuntu-latest
    # Csak main-re push esetén fut (ne fusson PR-en)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ci, qa-audit]  # Csak ha a build és az auditkapu is sikeres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # 2.122.1 rögzítve: a 2026-11-02-i v3.0.0 a supabase/config.toml [inbucket] szakaszát már nem fogadja el
          # ("[inbucket] … is no longer supported. Use [local_smtp]"), a db push ezért bukott. Frissítés külön PR-ben, a config átírásával.
          version: 2.122.1

      - name: Push DB migrations
        # SUPABASE_DB_PASSWORD szükséges: Supabase Dashboard → Project Settings → Database → Reset password
        # Majd: GitHub → Settings → Secrets → SUPABASE_DB_PASSWORD
        run: |
          supabase link --project-ref rpwajsbxrvypeqaalhvd
          # --include-all: a párhuzamos sessionök előre foglalnak migrációszámot (pl. 058, 059–064 nyitott PR-ben, 065–066 előbb mergelve);
          # kapcsoló nélkül a CLI elutasítja a remote utolsó migrációjánál kisebb számú, még nem futott fájlt. Norbert döntése 2026-11-01.
          supabase db push --yes --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
